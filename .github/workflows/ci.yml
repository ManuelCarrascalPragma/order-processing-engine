name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Test & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build and run tests
        run: ./gradlew clean test --no-daemon

      - name: Verify coverage (JaCoCo)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon

      - name: Mutation testing (Pitest)
        run: ./gradlew pitest --no-daemon

      # OWASP Dependency Check depende de la base de datos de la NVD (NIST).
      # Sin una NVD API key la actualizacion puede devolver 403/404; este paso
      # se marca como no bloqueante para no romper el pipeline por fallos de red
      # del servicio externo. Las vulnerabilidades reales (CVSS >= 7) siguen
      # fallando el analisis cuando la base de datos esta disponible.
      # Para un scan fiable, crea el secret NVD_API_KEY en el repositorio.
      - name: OWASP Dependency Check
        continue-on-error: true
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/tests
            build/reports/jacoco
            build/reports/pitest
            build/reports/dependency-check-report.html
          if-no-files-found: ignore
