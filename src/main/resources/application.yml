# ---------------------------------------------------------------------------
# Configuracion TRANSVERSAL (comun a todos los ambientes)
#   Las conexiones (datasource, jpa) y credenciales viven en los perfiles
#   especificos: application-dev.yml / application-prod.yml
#
# Enrutador de perfiles dinamico: cae en 'dev' si no se define
# SPRING_PROFILES_ACTIVE en el entorno.
# ---------------------------------------------------------------------------
spring:
  application:
    name: order-processing-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
        
payment:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_local}
